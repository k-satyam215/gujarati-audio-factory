services:
  - type: web
    name: gujarati-audio-factory
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TTS_MODEL
        value: gemini-3.1-flash-tts-preview
      - key: HOST_A_VOICE
        value: Aoede
      - key: HOST_B_VOICE
        value: Leda
